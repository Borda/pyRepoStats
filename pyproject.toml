[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-stats"
dynamic = ["version"]
description = "Repository Statistics"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jiri Borovec" }]
keywords = ["repository", "stats"]
dependencies = [
    "numpy >= 2.0",
    "PyGithub >= 2.10.0",
    "pandas >= 2.0",
    "tabulate",
    "matplotlib",
    "tqdm",
    "packaging",
    "jsonargparse",
]
classifiers = [
    "Environment :: Console",
    "Natural Language :: English",
    # How mature is this project? Common values are
    #   3 - Alpha, 4 - Beta, 5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://borda.github.io/pyRepoStats"

[project.scripts]
repostat = "repo_stats.__main__:cli_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "repo_stats.__about__.__version__" }

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".github",
    "dist",
    "build",
    "docs",
]
addopts = [
    "--strict-markers",
    "--doctest-modules",
    "--durations=25",
    "--color=yes",
    "--disable-pytest-warnings",
]
#filterwarnings = ["error::FutureWarning", "error::DeprecationWarning"]
xfail_strict = false  # TODO: true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "pass",
]
[tool.coverage.run]
parallel = true
#concurrency = "thread"
relative_files = true


[tool.codespell]
#skip = '*.py'
quiet-level = 3
# comma separated list of words; waiting for:
#  https://github.com/codespell-project/codespell/issues/2839#issuecomment-1731601603
# also adding links until they ignored by its: nature
#  https://github.com/codespell-project/codespell/issues/2243#issuecomment-1732019960
#ignore-words-list = ""


[tool.docformatter]
recursive = true
# this need to be shorter as some docstings are r"""...
wrap-summaries = 119
wrap-descriptions = 120
blank = true


[tool.ruff]
line-length = 120
exclude = [
  ".git",
  ".hg",
  ".venv",
  ".eggs",
  "_build",
  "buck-out",
  "build",
  "dist",
]
target-version = "py312"
# Enable Pyflakes `E` and `F` codes by default.
lint.select = [
    "E", "W",  # see: https://pypi.org/project/pycodestyle
    "F",  # see: https://pypi.org/project/pyflakes
    "I",  # isort
    "UP",  # see: https://pypi.org/project/pyupgrade
    "RUF100",  # yesqa
#    "D",  # see: https://pypi.org/project/pydocstyle
#    "N",  # see: https://pypi.org/project/pep8-naming
#    "S",  # see: https://pypi.org/project/flake8-bandit
]
lint.extend-select = [
    "C4",  # see: https://pypi.org/project/flake8-comprehensions
    "PT",  # see: https://pypi.org/project/flake8-pytest-style
    "RET",  # see: https://pypi.org/project/flake8-return
    "SIM",  # see: https://pypi.org/project/flake8-simplify
    "YTT",  # see: https://pypi.org/project/flake8-2020
#    "ANN",  # see: https://pypi.org/project/flake8-annotations
]
lint.unfixable = ["F401"]
