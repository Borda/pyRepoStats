<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">Analyze flow</title>
<desc id="d">Animated flow: comments pass a bot filter, a spam filter and a time window; kept ones become per-user bars and a heatmap.</desc>
<style>
