  [style*="animation:hm12 "]{opacity:.83!important}
  [style*="animation:hm13 "]{opacity:.41!important}
  [style*="animation:hm20 "]{opacity:.15!important}
  [style*="animation:hm22 "]{opacity:.66!important}
}
