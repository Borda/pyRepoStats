<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">Token resolution</title>
<desc id="d">Animated list of token sources tried in order; the gh CLI login is found and its token passes through a pipe into memory only.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{fill:#8b949e} .s{font-size:11px} .h{font-size:20px;font-weight:600} .b{font-weight:600}
.card{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.mid{text-anchor:middle} .end{text-anchor:end}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important}
  [style*="animation:m0 "],[style*="animation:m1 "],[style*="animation:m2 "],[style*="animation:m4 "],[style*="animation:h3 "],[style*="animation:p0 "],[style*="animation:p1 "],[style*="animation:p2 "],[style*="animation:p3 "]{opacity:1!important}
}
@keyframes m0{0%{opacity:0}6%{opacity:0}8%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
@keyframes m1{0%{opacity:0}19%{opacity:0}21%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
@keyframes m2{0%{opacity:0}32%{opacity:0}34%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
@keyframes g3{0%{stroke:#30363d;opacity:0}45%{stroke:#30363d;opacity:0}47%{stroke:#3fb950;opacity:1}93%{stroke:#3fb950;opacity:1}97%{stroke:#3fb950;opacity:0}100%{opacity:0}}
@keyframes h3{0%{opacity:0}45%{opacity:0}47%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
@keyframes m4{0%{opacity:0}58%{opacity:0}60%{opacity:.5}93%{opacity:.5}97%{opacity:0}100%{opacity:0}}
@keyframes tok{0%{opacity:0;transform:translateX(0)}47%{opacity:0;transform:translateX(0)}48%{opacity:1}59%{opacity:1;transform:translateX(70px)}61%{opacity:0;transform:translateX(70px)}100%{opacity:0}}
@keyframes p0{0%{opacity:0}61%{opacity:0}64%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
@keyframes p1{0%{opacity:0}64%{opacity:0}67%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
@keyframes p2{0%{opacity:0}67%{opacity:0}70%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
@keyframes p3{0%{opacity:0}70%{opacity:0}73%{opacity:1}93%{opacity:1}97%{opacity:0}100%{opacity:0}}
</style>
<rect width="900" height="420" rx="14" fill="#0d1117"/>
<text class="h" x="30" y="40">where the token comes from</text>
<text class="s m" x="30" y="62">first hit wins · the value is never printed, logged or written</text>
<rect class="card" x="30" y="90" width="470" height="46" rx="8"/>
<circle cx="54" cy="113" r="12" fill="#30363d"/>
<text class="mid b" x="54" y="118" style="font-size:13px">1</text>
<text class="mono b" x="78" y="110" style="font-size:14px">--auth_token</text>
<text class="s m" x="78" y="126">explicit argument</text>
<text class="mono s end" style="animation:m0 10s linear infinite;opacity:0" x="486" y="118" fill="#8b949e">not set ✗</text>
<rect class="card" x="30" y="146" width="470" height="46" rx="8"/>
<circle cx="54" cy="169" r="12" fill="#30363d"/>
<text class="mid b" x="54" y="174" style="font-size:13px">2</text>
<text class="mono b" x="78" y="166" style="font-size:14px">GH_API_TOKEN</text>
<text class="s m" x="78" y="182">environment variable</text>
<text class="mono s end" style="animation:m1 10s linear infinite;opacity:0" x="486" y="174" fill="#8b949e">not set ✗</text>
<rect class="card" x="30" y="202" width="470" height="46" rx="8"/>
<circle cx="54" cy="225" r="12" fill="#30363d"/>
<text class="mid b" x="54" y="230" style="font-size:13px">3</text>
<text class="mono b" x="78" y="222" style="font-size:14px">GITHUB_TOKEN · GH_TOKEN</text>
<text class="s m" x="78" y="238">same names gh / Actions use</text>
<text class="mono s end" style="animation:m2 10s linear infinite;opacity:0" x="486" y="230" fill="#8b949e">not set ✗</text>
<rect class="card" x="30" y="258" width="470" height="46" rx="8"/>
<circle cx="54" cy="281" r="12" fill="#30363d"/>
<text class="mid b" x="54" y="286" style="font-size:13px">4</text>
<text class="mono b" x="78" y="278" style="font-size:14px">gh auth token</text>
<text class="s m" x="78" y="294">your gh login, read via a pipe</text>
<rect style="animation:g3 10s linear infinite;opacity:0;fill:#3fb9501f;stroke-width:2" x="30" y="258" width="470" height="46" rx="8"/><text class="mono s end" style="animation:h3 10s linear infinite;opacity:0" x="486" y="286" fill="#3fb950">found ✓ use this</text>
<rect class="card" x="30" y="314" width="470" height="46" rx="8"/>
<circle cx="54" cy="337" r="12" fill="#30363d"/>
<text class="mid b" x="54" y="342" style="font-size:13px">5</text>
<text class="mono b" x="78" y="334" style="font-size:14px">anonymous</text>
<text class="s m" x="78" y="350">60 requests / hour</text>
<text class="mono s end" style="animation:m4 10s linear infinite;opacity:0" x="486" y="342" fill="#8b949e">skipped</text>
<rect class="card" x="560" y="90" width="310" height="260" rx="10"/>
<text class="b" x="580" y="120">in memory only</text>
<rect x="580" y="136" width="95" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
<text class="mono s mid" x="627.5" y="160">gh</text>
<rect x="755" y="136" width="95" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
<text class="mono s mid" x="802.5" y="160">repostat</text>
<line x1="677" y1="156" x2="753" y2="156" stroke="#8b949e" stroke-dasharray="4 4"/>
<text class="s m mid" x="715" y="148">stdout pipe</text>
<circle style="animation:tok 10s linear infinite;opacity:0" cx="680" cy="156" r="5" fill="#3fb950"/>
<text class="s" style="animation:p0 10s linear infinite;opacity:0" x="580" y="206" fill="#3fb950">✓ <tspan fill="#e6edf3">not on the command line</tspan></text>
<text class="s" style="animation:p1 10s linear infinite;opacity:0" x="580" y="230" fill="#3fb950">✓ <tspan fill="#e6edf3">not in shell history</tspan></text>
<text class="s" style="animation:p2 10s linear infinite;opacity:0" x="580" y="254" fill="#3fb950">✓ <tspan fill="#e6edf3">not in logs or the JSON cache</tspan></text>
<text class="s" style="animation:p3 10s linear infinite;opacity:0" x="580" y="278" fill="#3fb950">✓ <tspan fill="#e6edf3">not sent anywhere but api.github.com</tspan></text>
<text class="s m" x="560" y="376">set it up once:  gh auth login</text>
</svg>
